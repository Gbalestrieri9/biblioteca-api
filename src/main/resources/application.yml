spring:
  application:
    name: biblioteca-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biblioteca}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASSWORD:biblioteca}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      pool-name: biblioteca-hikari

  jpa:
    open-in-view: false
    hibernate:
      # O schema é controlado exclusivamente pelo Flyway; o Hibernate apenas
      # valida se as entidades batem com as tabelas existentes.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # Otimização de acesso a dados: agrupa INSERT/UPDATE em lotes,
          # reduzindo o número de round-trips ao banco (requisito de
          # "operações em lote").
          batch_size: 30
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        query:
          in_clause_parameter_padding: true
        default_batch_fetch_size: 30

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Configurações específicas do domínio da biblioteca.
biblioteca:
  emprestimo:
    prazo-dias: 14
  timezone: UTC
  jwt:
    # Segredo usado para assinar/validar os tokens JWT (HMAC-SHA256) — o
    # valor abaixo é só para desenvolvimento local; SEMPRE sobrescreva com
    # a variável de ambiente JWT_SECRET em qualquer ambiente real (ver
    # README.md). Precisa ter pelo menos 32 caracteres (256 bits) para
    # HMAC-SHA256.
    secret: ${JWT_SECRET:biblioteca-online-chave-secreta-de-desenvolvimento-trocar-em-producao}
    # Tempo de validade do token, em milissegundos (padrão: 24h).
    expiracao-ms: ${JWT_EXPIRACAO_MS:86400000}

logging:
  level:
    root: INFO
    com.postech.biblioteca: INFO
    org.hibernate.SQL: WARN
